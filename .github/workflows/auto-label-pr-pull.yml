name: Auto-label pr-pull
on:
  workflow_run:
    workflows: ["Homebrew build, test & prepare artifacts"]
    types:
      - completed

permissions: {}

jobs:
  label:
    permissions:
      pull-requests: write
    # Fork PRs are never auto-labelled: the `pr-pull` label makes publish.yml
    # push bottles to main, so it stays a manual, reviewed decision.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: graelo
          repositories: homebrew-tap
          permission-pull-requests: write

      - name: Add pr-pull label
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No PR number found — skipping."
            exit 0
          fi
          gh pr edit "$PR_NUMBER" --add-label "pr-pull"
