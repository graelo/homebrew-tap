name: Livecheck & bump

on:
  schedule:
    - cron: '0 18 * * 2,5,0' # Tuesday, Friday, Sunday at 18:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  # Casks carry no bottles, so all bumps can travel in a single PR.
  bump-casks:
    permissions:
      contents: write # push the bump branch
      pull-requests: write # open the PR
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Tap self
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/graelo"
          ln -sfn "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/graelo/homebrew-tap"

      - name: Trust this tap
        run: brew trust graelo/tap

      - name: Livecheck all casks
        id: livecheck
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          outdated=$(brew livecheck --cask --tap graelo/tap --json \
            | jq -r '.[] | select(.version.outdated == true) | "\(.cask)=\(.version.latest)"')
          {
            echo "outdated<<EOF"
            echo "$outdated"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$outdated" ]; then
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump outdated casks
        if: steps.livecheck.outputs.has_updates == 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTDATED: ${{ steps.livecheck.outputs.outdated }}
        run: |
          while IFS='=' read -r cask version; do
            [ -z "$cask" ] && continue
            echo "Bumping $cask to $version"
            brew bump-cask-pr "graelo/tap/$cask" \
              --version "$version" \
              --no-audit \
              --no-browse \
              --no-style \
              --write-only
          done <<< "${OUTDATED}"

      - name: Create PR
        if: steps.livecheck.outputs.has_updates == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          branch="livecheck/$(date +%Y%m%d)"
          git checkout -b "$branch"
          git add Casks/
          git commit -m "bump casks via livecheck"
          git push -u origin "$branch"
          gh pr create \
            --title "Bump casks ($(date +%Y-%m-%d))" \
            --body "Automated version bump from livecheck." \
            --base main

  # Formulae need bottles, which tests.yml builds per PR and publish.yml pulls
  # via the `pr-pull` label, so each formula gets its own PR.
  bump-formulae:
    # PRs are opened with the app token, not GITHUB_TOKEN: events created by
    # GITHUB_TOKEN never trigger further workflow runs, so tests.yml would sit
    # at `action_required` and auto-label-pr-pull.yml would never fire.
    permissions:
      contents: read
    runs-on: macos-latest
    env:
      BOT_NAME: 'graelo-ci-bot[bot]'
      BOT_USER_ID: '274240725'
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: graelo
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Tap self
        run: |
          mkdir -p "$(brew --repository)/Library/Taps/graelo"
          ln -sfn "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/graelo/homebrew-tap"

      - name: Trust this tap
        run: brew trust graelo/tap

      - name: Livecheck all formulae
        id: livecheck
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # huggingface-cli-full: `resource` blocks need regenerating by hand
          # (scripts/create-resource-blocks.py), so never bump it automatically.
          SKIP: huggingface-cli-full
        run: |
          outdated=$(brew livecheck --formula --tap graelo/tap --json \
            | jq -r --arg skip "$SKIP" '
                ($skip | split(" ")) as $s
                | .[]
                | select(.version.outdated == true)
                | select(.formula as $f | $s | index($f) | not)
                | "\(.formula)=\(.version.latest)"')
          {
            echo "outdated<<EOF"
            echo "$outdated"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open one PR per outdated formula
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          OUTDATED: ${{ steps.livecheck.outputs.outdated }}
        run: |
          [ -z "${OUTDATED//[[:space:]]/}" ] && exit 0
          gh auth setup-git
          git config user.name "${BOT_NAME}"
          git config user.email "${BOT_USER_ID}+${BOT_NAME}@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"

          while IFS='=' read -r formula version; do
            [ -z "$formula" ] && continue
            branch="livecheck/$formula-$version"
            if gh pr list --head "$branch" --state open --json number \
              | jq -e 'length > 0' >/dev/null; then
              echo "PR for $branch already exists, skipping"
              continue
            fi
            echo "Bumping $formula to $version"
            git checkout -B "$branch" origin/main
            brew bump-formula-pr "graelo/tap/$formula" \
              --version "$version" \
              --no-audit \
              --no-browse \
              --write-only
            git commit -am "$formula $version"
            git push -u origin "$branch"
            gh pr create \
              --title "$formula $version" \
              --body "Automated version bump from livecheck. Label \`pr-pull\` to publish once bottles are built." \
              --base main
          done <<< "${OUTDATED}"
